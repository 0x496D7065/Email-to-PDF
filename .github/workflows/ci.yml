# Continuous integration: runs every check on each push and pull request.
# If any step fails, the run fails (README.md, rule R3).
name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow can only read the repository, nothing else.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # A stuck run must not burn the private repo's limited CI minutes.
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA: a tag can be moved, a SHA can't.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the GitHub token in .git/config for later steps.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # Clean install exactly what package-lock.json says.
      - name: Install dependencies
        run: npm ci

      # Strict on purpose: a newly published advisory can fail CI with no code change; then update the package (or consciously raise --audit-level).
      - name: Audit dependencies
        run: npm audit

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Also runs scripts/check-no-network.mjs on the built output.
      - name: Build and no-network check
        run: npm run build

  # End-to-end tests, one job per browser engine, run in parallel once the
  # checks above have passed. No network requests and no CSP violations.
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One browser failing must not hide the results of the others.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: e2e (${{ matrix.browser }})
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only this job's browser, with the system packages it needs.
      - name: Install Playwright ${{ matrix.browser }}
        run: npm run test:e2e:install:${{ matrix.browser }} -- --with-deps

      # Playwright rebuilds the site itself before testing (playwright.config.ts).
      - name: End-to-end tests (${{ matrix.browser }})
        run: npm run test:e2e:${{ matrix.browser }}
